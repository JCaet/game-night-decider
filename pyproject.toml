[project]
name = "game-night-decider"
version = "1.3.5"
description = "Telegram bot to decide what to play on game night"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "João Caetano", email = "joaomartinscaetano@proton.me"},
]
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[job-queue]>=22.5",
    "tornado>=6.5.7",
    "sqlalchemy[asyncio]>=2.0.49,<2.1",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "alembic>=1.18.5",
]

[project.scripts]
bot = "src.bot.main:main"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_release = true
commit_message = "{version} [skip ci]"
# uv records the project's own version in uv.lock, but semantic-release only
# patches version_toml — so every release left the lockfile a version behind and
# the next `uv` invocation dirtied the working tree. Re-lock after the bump and
# include the result in the release commit. `uv lock` does not upgrade existing
# pins, so this only rewrites the project version line.
build_command = "uv lock"
assets = ["uv.lock"]

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.changelog.default_templates]
output_format = "md"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["scripts/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict_optional = false
ignore_missing_imports = true
mypy_path = "src"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "types-requests>=2.33.0.20260518",
    "types-aiofiles>=25.1.0.20260518",
]
